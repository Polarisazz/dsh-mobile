name: Build DSH Mobile APK
on:
  workflow_dispatch:
    inputs:
      source_zip_url:
        description: 官方完整源码包(含 710MB 固定离线输入)URL
        required: true
        default: https://github.com/DSH-APP/DSHA/releases/download/v0.2.1-rc.2/DSHA-0.2.1-rc.2-20261022.2100-source.zip
        type: string
      source_zip_sha256:
        description: 上述源码包的 SHA-256
        required: true
        default: ef134fe8713bfa4d6cf3bdea883be1591246d4b78ace16bd924f6d739188425a
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout (our customizations)
        uses: actions/checkout@v4

      - name: Download official source bundle (with locked inputs)
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o src.zip "${{ inputs.source_zip_url }}"
          echo "${{ inputs.source_zip_sha256 }}  src.zip" | sha256sum -c -
          rm -rf upstream && mkdir -p upstream
          unzip -q src.zip -d upstream
          # 官方源码包可能是「平铺」也可能是「带一层目录」，用 settings.gradle 定位真正的工程根
          ROOT=""
          if [ -f upstream/settings.gradle ]; then
            ROOT="upstream"
          else
            for d in upstream/*/; do
              if [ -f "${d}settings.gradle" ]; then ROOT="${d%/}"; break; fi
            done
          fi
          if [ -z "$ROOT" ]; then
            echo "::error::无法定位工程根(settings.gradle 未找到)"; find upstream -maxdepth 3 -name settings.gradle; exit 1
          fi
          echo "SRC=$ROOT" >> "$GITHUB_ENV"
          echo "source root: $ROOT"
          ls "$ROOT" | head

      - name: Apply DSH Mobile customizations + bundle sync engine
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tools/apply-dsh-mobile.py" "$SRC" "$GITHUB_WORKSPACE/sync/sync.mjs"

      - name: Resolve toolchain versions (from the project itself)
        id: toolchain
        run: |
          cd "$SRC"
          python3 tools/ci-toolchain.py --github-output
          echo "--- values ---"
          python3 tools/ci-toolchain.py

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}

      - name: Use preinstalled Android SDK (put sdkmanager on PATH)
        run: |
          set -euo pipefail
          SDKROOT=""; SDKBIN=""
          for root in /usr/local/lib/android/sdk /opt/android-sdk "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}"; do
            [ -z "$root" ] && continue
            for b in "$root/cmdline-tools/latest/bin" "$root/cmdline-tools/16.0/bin" "$root/tools/bin"; do
              if [ -x "$b/sdkmanager" ]; then SDKROOT="$root"; SDKBIN="$b"; break 2; fi
            done
          done
          if [ -z "$SDKROOT" ]; then echo "::error::找不到预装 sdkmanager"; ls -la /usr/local/lib/android/sdk 2>/dev/null || true; exit 1; fi
          echo "使用 SDK: $SDKROOT (bin: $SDKBIN)"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "$SDKBIN" >> "$GITHUB_PATH"
          echo "$SDKROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKBIN/sdkmanager" --version || true

      - name: Android SDK + NDK (with 37→36 fallback)
        run: |
          set -euo pipefail
          cd "$SRC"
          platform=$(python3 tools/ci-toolchain.py --field androidPlatform)   # e.g. android-37.0
          buildtools=$(python3 tools/ci-toolchain.py --field buildTools)
          ndk=$(python3 tools/ci-toolchain.py --field ndk)
          yes | sdkmanager --licenses > /dev/null || true
          if sdkmanager "platforms;$platform" "build-tools;$buildtools" "ndk;$ndk"; then
            echo "installed requested platform $platform"
          else
            echo "::warning::$platform 不可用，回退 android-36 并把 compileSdk/targetSdk 降到 36"
            sdkmanager "platforms;android-36" "build-tools;$buildtools" || { echo "::error::build-tools 安装失败"; exit 1; }
            sdkmanager "ndk;$ndk" || echo "::warning::NDK 安装失败(继续，仅影响部分 native 检查)"
            FORCE_SDK=36 python3 "$GITHUB_WORKSPACE/tools/apply-dsh-mobile.py" "$SRC" ""
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"; ls "$ANDROID_HOME/platforms"

      - name: Build installable debug APK
        run: |
          set -euo pipefail
          cd "$SRC"
          chmod +x gradlew
          ./gradlew :app:assembleStandardDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Mobile-debug-apk
          path: |
            ${{ env.SRC }}/app/build/outputs/apk/standard/debug/*.apk
            ${{ env.SRC }}/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 30
